<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typefolio</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg {
      color: var(--accent-fg);
    }

    .logo-text {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .tagline {
      color: var(--text2);
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
      max-width: 280px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #sign-in-btn {
      font-size: 14px;
      padding: 10px 28px;
      border-radius: 10px;
    }

    .hint {
      color: var(--text3);
      font-size: 11px;
    }

    .status {
      font-size: 12px;
      color: var(--text2);
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="titlebar"></div>

  <div class="content">
    <div class="logo">
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
      </div>
      <span class="logo-text">Typefolio</span>
    </div>

    <p class="tagline">Your fonts, on every device. Upload once, sync everywhere.</p>

    <div class="actions">
      <button class="btn btn-primary" id="sign-in-btn">Continue with browser</button>
      <span class="hint">Opens your browser to sign in securely</span>
    </div>

    <span class="status" id="status"></span>
  </div>
</body>
<script>
  const btn = document.getElementById('sign-in-btn');
  const status = document.getElementById('status');

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Opening browser…';
    status.textContent = 'Waiting for sign-in…';
    await window.typefolio.signIn();
  });

  window.typefolio.onAuthComplete((email) => {
    status.textContent = `Signed in as ${email}`;
  });
</script>
</html>
