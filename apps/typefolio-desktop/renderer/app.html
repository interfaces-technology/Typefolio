<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typefolio</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 0 0 12px;
    }

    .sidebar-top {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .app-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-mark-sm {
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-section {
      padding: 0 8px;
      flex: 1;
    }

    .sidebar-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 6px 8px 4px;
    }

    .sidebar-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      color: var(--text2);
      font-size: 12px;
    }

    .sidebar-stat span:first-child { color: var(--text2); }
    .sidebar-stat span:last-child  { color: var(--text); font-weight: 500; }

    .sidebar-bottom {
      padding: 8px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
    }

    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg3);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--text2);
      flex-shrink: 0;
    }

    .user-email {
      font-size: 11px;
      color: var(--text2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .toolbar-title {
      font-size: 13px;
      font-weight: 600;
      flex: 1;
    }

    .sync-status {
      font-size: 11px;
      color: var(--text3);
      margin-right: 4px;
    }

    /* ── Font list ── */
    .font-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text3);
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      opacity: 0.3;
    }

    .empty-state p { font-size: 13px; }
    .empty-state .sub { font-size: 12px; color: var(--text3); }

    /* Family group */
    .family-group { margin-bottom: 2px; }

    .family-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.1s;
    }
    .family-header:hover { background: var(--bg2); }

    .family-chevron {
      width: 14px;
      height: 14px;
      color: var(--text3);
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .family-group.open .family-chevron { transform: rotate(90deg); }

    .family-name {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
    }

    .family-count {
      font-size: 11px;
      color: var(--text3);
    }

    /* Font rows */
    .font-rows { display: none; }
    .family-group.open .font-rows { display: block; }

    .font-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 6px 38px;
      transition: background 0.1s;
    }
    .font-row:hover { background: var(--bg2); }
    .font-row:hover .delete-btn { opacity: 1; }

    .font-style { font-size: 12px; color: var(--text2); flex: 1; }
    .font-ext {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text3);
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .font-size { font-size: 11px; color: var(--text3); min-width: 44px; text-align: right; }

    .delete-btn {
      opacity: 0;
      padding: 3px;
      border-radius: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text3);
      display: flex;
      transition: opacity 0.1s, color 0.1s, background 0.1s;
    }
    .delete-btn:hover { color: var(--danger); background: rgba(239,68,68,0.08); }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text3);
      font-size: 13px;
      gap: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--text2);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* Drop zone overlay */
    .dropzone-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.04);
      border: 2px dashed var(--text2);
      border-radius: 12px;
      margin: 8px;
      z-index: 100;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--text2);
      pointer-events: none;
    }
    .dropzone-overlay.active { display: flex; }
  </style>
</head>
<body>
  <div class="titlebar" style="background:var(--bg2);border-bottom:1px solid var(--border)"></div>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="app-title">
          <div class="logo-mark-sm">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 7 4 4 20 4 20 7"></polyline>
              <line x1="9" y1="20" x2="15" y2="20"></line>
              <line x1="12" y1="4" x2="12" y2="20"></line>
            </svg>
          </div>
          Typefolio
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">Library</div>
        <div class="sidebar-stat">
          <span>Fonts</span>
          <span id="stat-fonts">—</span>
        </div>
        <div class="sidebar-stat">
          <span>Families</span>
          <span id="stat-families">—</span>
        </div>
      </div>

      <div class="sidebar-bottom">
        <div class="user-row">
          <div class="avatar" id="avatar">?</div>
          <span class="user-email" id="user-email">Loading…</span>
          <button class="btn btn-ghost btn-icon btn-sm" id="sign-out-btn" title="Sign out">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="toolbar">
        <span class="toolbar-title">My Fonts</span>
        <span class="sync-status" id="sync-status"></span>
        <button class="btn btn-sm" id="download-all-btn" title="Download all as ZIP">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download all
        </button>
        <button class="btn btn-primary btn-sm" id="upload-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Upload fonts
        </button>
      </div>

      <div class="font-list" id="font-list">
        <div class="loading"><div class="spinner"></div> Loading…</div>
      </div>
    </main>
  </div>

  <div class="dropzone-overlay" id="drop-overlay">Drop font files to upload</div>
</body>
<script>
  let families = [];
  let totalFonts = 0;

  function formatBytes(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function renderFamilies() {
    const list = document.getElementById('font-list');

    if (!families.length) {
      list.innerHTML = `
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
          <p>No fonts yet</p>
          <span class="sub">Upload fonts to get started</span>
        </div>`;
      return;
    }

    list.innerHTML = families.map((fam, fi) => `
      <div class="family-group open" data-fi="${fi}">
        <div class="family-header" onclick="toggleFamily(${fi})">
          <svg class="family-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
          <span class="family-name">${fam.familyName}</span>
          <span class="family-count">${fam.fonts.length} ${fam.fonts.length === 1 ? 'style' : 'styles'}</span>
        </div>
        <div class="font-rows">
          ${fam.fonts.map(f => `
            <div class="font-row" data-font-id="${f.id}">
              <span class="font-style">${f.styleName || f.originalName}</span>
              <span class="font-ext">${f.extension?.replace('.','') || ''}</span>
              <span class="font-size">${formatBytes(f.size)}</span>
              <button class="delete-btn" onclick="deleteFont('${f.id}', event)" title="Remove">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  function toggleFamily(fi) {
    document.querySelector(`[data-fi="${fi}"]`).classList.toggle('open');
  }

  async function deleteFont(fontId, e) {
    e.stopPropagation();
    const row = document.querySelector(`[data-font-id="${fontId}"]`);
    if (row) row.style.opacity = '0.4';
    await window.typefolio.deleteFont(fontId);
    await loadLibrary();
  }

  async function loadLibrary() {
    const data = await window.typefolio.getLibrary();
    if (data.error) {
      document.getElementById('font-list').innerHTML =
        `<div class="loading">Failed to load library</div>`;
      return;
    }
    families = data.families || [];
    totalFonts = families.reduce((n, f) => n + f.fonts.length, 0);
    document.getElementById('stat-fonts').textContent = totalFonts;
    document.getElementById('stat-families').textContent = families.length;
    renderFamilies();
  }

  async function init() {
    const user = await window.typefolio.getUser();
    const email = user.email || '';
    document.getElementById('user-email').textContent = email;
    document.getElementById('avatar').textContent = email[0]?.toUpperCase() || '?';
    await loadLibrary();
  }

  document.getElementById('upload-btn').addEventListener('click', async () => {
    const result = await window.typefolio.uploadFonts();
    if (!result?.canceled) await loadLibrary();
  });

  document.getElementById('download-all-btn').addEventListener('click', () => {
    window.typefolio.downloadAll();
  });

  document.getElementById('sign-out-btn').addEventListener('click', () => {
    window.typefolio.signOut();
  });

  window.typefolio.onSyncUpdate((msg) => {
    const el = document.getElementById('sync-status');
    el.textContent = msg;
    if (msg.startsWith('Installed')) loadLibrary();
    setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
  });

  init();
</script>
</html>
